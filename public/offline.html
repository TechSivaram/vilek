<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#092d50" />
    <title>ViLek is offline</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #172b42; background: #f7f9fc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 420px); padding: 32px 26px; border: 1px solid #e8edf2; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 16px 45px rgba(23,43,66,.07); }
      img { width: 88px; height: 88px; object-fit: contain; margin-bottom: 16px; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #68788b; line-height: 1.6; font-size: 14px; }
      button { margin-top: 24px; border: 0; border-radius: 10px; padding: 12px 20px; background: #092d50; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #12a9a0; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="ViLek" />
      <h1>You're currently offline</h1>
      <p>ViLek needs an internet connection to securely load your workspace. Your account and financial information have not been stored for offline access.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
